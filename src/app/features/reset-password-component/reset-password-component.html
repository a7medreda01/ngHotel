<div class="auth-page" dir="rtl">
  <div class="auth-bg">
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>
  </div>

  <div class="auth-card">

    <!-- ❌ Token Invalid -->
    <div *ngIf="tokenMissing" class="auth-brand">
      <div class="brand-icon warning-icon">
        <i class="bi bi-x-circle-fill"></i>
      </div>
      <h1>رابط غير صالح</h1>
      <p>هذا الرابط منتهي الصلاحية أو غير صحيح</p>

      <button class="btn-login" routerLink="/forget-password">
        <i class="bi bi-arrow-repeat"></i>
        طلب رابط جديد
      </button>
    </div>

    <!-- ✅ Reset Form -->
    <ng-container *ngIf="!tokenMissing">

      <div class="auth-brand">
        <div class="brand-icon warning-icon">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h1>إعادة تعيين كلمة المرور</h1>
        <p>أدخل كلمة مرور جديدة للحساب</p>
      </div>

      <!-- Success -->
      <div class="alert-success" *ngIf="successMessage">
        <i class="bi bi-check-circle-fill"></i>
        {{ successMessage }}
      </div>

      <!-- Error -->
      <div class="alert-error" *ngIf="errorMessage">
        <i class="bi bi-exclamation-circle-fill"></i>
        {{ errorMessage }}
      </div>

      <!-- Form -->
      <div class="auth-form" *ngIf="!successMessage">

        <!-- Password -->
        <div class="form-group">
          <label>كلمة المرور الجديدة</label>
          <div class="input-wrapper">
            <i class="bi bi-lock-fill input-icon"></i>
            <input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="newPassword"
              placeholder="••••••••"
            />

            <button class="toggle-pw" type="button" (click)="showPassword = !showPassword">
              <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
            </button>
          </div>

          <span class="field-hint" *ngIf="newPassword && newPassword.length < 6">
            <i class="bi bi-info-circle"></i>
            يجب أن تكون 6 أحرف على الأقل
          </span>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label>تأكيد كلمة المرور</label>
          <div class="input-wrapper" [class.input-error]="confirmPassword && !passwordsMatch">
            <i class="bi bi-lock-fill input-icon"></i>
            <input
              [type]="showConfirm ? 'text' : 'password'"
              [(ngModel)]="confirmPassword"
              placeholder="••••••••"
            />

            <button class="toggle-pw" type="button" (click)="showConfirm = !showConfirm">
              <i class="bi" [ngClass]="showConfirm ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
            </button>
          </div>

          <span class="field-hint" *ngIf="confirmPassword && !passwordsMatch">
            <i class="bi bi-x-circle"></i>
            كلمتا المرور غير متطابقتين
          </span>
        </div>

        <!-- Submit -->
        <button class="btn-login" (click)="onSubmit()" [disabled]="!isValid">
          <span class="btn-spinner" *ngIf="isLoading"></span>
          <i class="bi bi-check-lg" *ngIf="!isLoading"></i>
          {{ isLoading ? 'جاري الحفظ...' : 'تعيين كلمة المرور' }}
        </button>
      </div>

      <!-- Back -->
      <div class="back-link">
        <a routerLink="/login">
          <i class="bi bi-arrow-right"></i>
          العودة لتسجيل الدخول
        </a>
      </div>

    </ng-container>
  </div>
</div>

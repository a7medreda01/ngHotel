<div class="notif-wrapper">

  <!-- زر الجرس -->
  <button class="notif-trigger" (click)="toggleDropdown()" [class.active]="isOpen" type="button">
    <i class="bi bi-bell-fill"></i>
    <span class="notif-badge" *ngIf="unreadCount > 0">
      {{ unreadCount > 99 ? '99+' : unreadCount }}
    </span>
    <span class="notif-pulse" *ngIf="unreadCount > 0"></span>
  </button>

  <!-- Dropdown -->
  <div class="notif-dropdown" [class.open]="isOpen" (click)="$event.stopPropagation()">

    <div class="notif-header">
      <div class="notif-title">
        <i class="bi bi-bell-fill"></i>
        الإشعارات
        <span class="unread-chip" *ngIf="unreadCount > 0">{{ unreadCount }} جديد</span>
      </div>
      <button class="mark-all-btn" *ngIf="unreadCount > 0" (click)="markAllRead()" type="button">
        <i class="bi bi-check2-all"></i> قراءة الكل
      </button>
    </div>

    <div class="notif-list">
      <ng-container *ngIf="notifications.length > 0; else emptyState">
        <div
          class="notif-item"
          *ngFor="let n of notifications"
          [class.unread]="!n.isRead"
          [class.clickable]="n.bookingId"
          (click)="onNotifClick(n)"
        >
          <div class="notif-icon-wrap" [class.icon-new]="!n.isRead">
            <i class="bi bi-calendar-check-fill"></i>
          </div>
          <div class="notif-content">
            <div class="notif-item-title">{{ n.title }}</div>
            <div class="notif-item-msg">{{ n.message }}</div>
            <div class="notif-time">
              <i class="bi bi-clock"></i>
              {{ formatTime(n.createdAt) }}
            </div>
          </div>
          <div class="notif-unread-dot" *ngIf="!n.isRead"></div>
          <div class="notif-arrow" *ngIf="n.bookingId">
            <i class="bi bi-chevron-left"></i>
          </div>
        </div>
      </ng-container>
      <ng-template #emptyState>
        <div class="notif-empty">
          <i class="bi bi-bell-slash"></i>
          <p>لا توجد إشعارات</p>
        </div>
      </ng-template>
    </div>

    <div class="notif-footer" *ngIf="notifications.length > 0">
      <button class="refresh-btn" (click)="refresh()" type="button">
        <i class="bi bi-arrow-clockwise"></i> تحديث
      </button>
    </div>

  </div>

  <!-- Overlay لإغلاق الـ dropdown -->
  <div class="notif-overlay" *ngIf="isOpen" (click)="closeDropdown()"></div>
</div>

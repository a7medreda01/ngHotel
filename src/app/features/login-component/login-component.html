<!-- login.component.html -->
<div class="auth-page d-flex flex-column">
  <div class="auth-bg">
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>
  </div>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-icon">
        <img src="favicon.ico" alt="" class="img-fluid">
      </div>
      <h1>{{ 'auth.welcome' | translate }}</h1>
      <p>{{ 'auth.loginSubtitle' | translate }}</p>
    </div>

    <div class="alert-error" *ngIf="errorMessage">
      <i class="bi bi-exclamation-circle-fill"></i>
      {{ errorMessage }}
    </div>

    <div class="auth-form">
      <div class="form-group">
        <label>{{ 'auth.email' | translate }}</label>
        <div class="input-wrapper">
          <i class="bi bi-envelope-fill input-icon"></i>
          <input
            type="email"
            [(ngModel)]="email"
            placeholder="example@email.com"
            (keyup.enter)="onSubmit()"
            autocomplete="email"
          />
        </div>
      </div>

      <div class="form-group">
        <label>
          {{ 'auth.password' | translate }}
          <a routerLink="/forget-password" class="forgot-link">{{ 'auth.forgotPassword' | translate }}</a>
        </label>
        <div class="input-wrapper">
          <i class="bi bi-lock-fill input-icon"></i>
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            placeholder="••••••••"
            (keyup.enter)="onSubmit()"
            autocomplete="current-password"
          />
          <button class="toggle-pw" (click)="togglePassword()" type="button" tabindex="-1">
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
          </button>
        </div>
      </div>

      <button
        class="btn-login"
        (click)="onSubmit()"
        [disabled]="isLoading || !email || !password"
      >
        <span class="btn-spinner" *ngIf="isLoading"></span>
        <i class="bi bi-box-arrow-in-right" *ngIf="!isLoading"></i>
        {{ isLoading ? ('auth.loggingIn' | translate) : ('auth.login' | translate) }}
      </button>
    </div>
  </div>
  <div class="auth-footer">
    {{ 'auth.footerDesigned' | translate }}
    <a
      href="https://wa.me/201080225502"
      target="_blank"
      rel="noopener"
    >
      {{ 'auth.designerName' | translate }}
    </a>
  </div>
</div>

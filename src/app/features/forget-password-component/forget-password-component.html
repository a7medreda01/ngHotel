<!-- forget-password.component.html -->
<div class="auth-page" dir="rtl">
  <div class="auth-bg">
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>
  </div>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-icon warning-icon">
        <i class="bi bi-key-fill"></i>
      </div>
      <h1>نسيت كلمة المرور؟</h1>
      <p>أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة التعيين</p>
    </div>

    <!-- Success -->
    <div class="alert-success" *ngIf="successMessage">
      <i class="bi bi-check-circle-fill"></i>
      {{ successMessage }}
    </div>

    <!-- Error -->
    <div class="alert-error" *ngIf="errorMessage">
      <i class="bi bi-exclamation-circle-fill"></i>
      {{ errorMessage }}
    </div>

    <div class="auth-form" *ngIf="!successMessage">
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <div class="input-wrapper">
          <i class="bi bi-envelope-fill input-icon"></i>
          <input
            type="email"
            [(ngModel)]="email"
            placeholder="example@email.com"
            (keyup.enter)="onSubmit()"
          />
        </div>
      </div>

      <button class="btn-login" (click)="onSubmit()" [disabled]="isLoading || !email">
        <span class="btn-spinner" *ngIf="isLoading"></span>
        <i class="bi bi-send-fill" *ngIf="!isLoading"></i>
        {{ isLoading ? 'جاري الإرسال...' : 'إرسال رابط الاستعادة' }}
      </button>
    </div>

    <div class="back-link">
      <a routerLink="/login">
        <i class="bi bi-arrow-right"></i>
        العودة لتسجيل الدخول
      </a>
    </div>
  </div>
</div>
